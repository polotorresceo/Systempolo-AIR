<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SystemPolo AI - Catálogo de Videos Immunotec</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #121620;
      --immu-blue: #0052cc;
      --immu-electric: #00a3ff;
      --immu-cyan: #00f0ff;
      --magnetic-yellow: #ffcc00;
      --magnetic-yellow-glow: #ffe600;
      --snaptube-yellow: #ffd700;
      --badge-red: #ff1e27;
      --text-white: #ffffff;
      --text-muted: #b0b8c8;
      --border-glow: rgba(0, 163, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 82, 204, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.05) 0%, transparent 50%);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
    }

    /* HEADER / NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 12, 16, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--immu-blue);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 163, 255, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--magnetic-yellow), var(--immu-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-tag {
      background: var(--immu-blue);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header-cta {
      background: linear-gradient(135deg, var(--snaptube-yellow), var(--magnetic-yellow));
      color: #000;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.85rem;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-cta:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.9);
    }

    /* HERO SECTION */
    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .hero-card {
      background: linear-gradient(145deg, rgba(18, 22, 32, 0.9), rgba(10, 12, 16, 0.95));
      border: 2px solid var(--immu-electric);
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      box-shadow: 0 10px 30px rgba(0, 163, 255, 0.25);
    }

    @media (min-width: 850px) {
      .hero-card {
        grid-template-columns: 320px 1fr;
      }
    }

    .hero-video-container {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-bottom: 2px solid var(--immu-cyan);
    }

    @media (min-width: 850px) {
      .hero-video-container {
        border-bottom: none;
        border-right: 2px solid var(--immu-cyan);
      }
    }

    .hero-video-mask {
      position: relative;
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 520px;
      overflow: hidden;
      background: #000;
    }

    .hero-video-mask iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%) scale(1.35);
      border: none;
      pointer-events: auto;
    }

    .hero-video-mask::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .hero-video-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--badge-red);
      color: #fff;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 30, 39, 0.8);
      z-index: 10;
    }

    .hero-content {
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-subtitle {
      color: var(--immu-cyan);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #ffffff, var(--immu-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .offer-box {
      background: rgba(0, 82, 204, 0.15);
      border: 1px solid var(--immu-blue);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .price-tag {
      font-size: 2rem;
      font-weight: 900;
      color: var(--snaptube-yellow);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .price-tag span {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .bonus-tag {
      color: var(--immu-cyan);
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* BOTONES DE ACCIÓN EN EL HERO */
    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-btn {
      background: linear-gradient(135deg, var(--snaptube-yellow), #ffaa00);
      color: #000;
      font-size: 1.05rem;
      font-weight: 900;
      text-align: center;
      padding: 15px 20px;
      border-radius: 40px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .hero-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.9);
    }

    .funnel-btn {
      background: transparent;
      color: var(--immu-cyan);
      border: 2px solid var(--immu-cyan);
      font-size: 0.95rem;
      font-weight: 800;
      text-align: center;
      padding: 12px 20px;
      border-radius: 40px;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .funnel-btn:hover {
      background: var(--immu-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }

    /* FILTROS Y BUSCADOR */
    .controls-section {
      max-width: 1200px;
      margin: 30px auto 20px;
      padding: 0 20px;
    }

    .search-bar {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--border-glow);
      border-radius: 30px;
      padding: 14px 20px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    .search-bar:focus {
      border-color: var(--immu-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .filter-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--immu-blue);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--immu-blue);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 82, 204, 0.6);
    }

    /* CATALOGO DE VIDEOS 9:16 */
    .catalog-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .section-title::before {
      content: '';
      width: 5px;
      height: 24px;
      background: var(--snaptube-yellow);
      border-radius: 3px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    @media (min-width: 600px) {
      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    .video-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 163, 255, 0.2);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .video-card:hover {
      transform: translateY(-6px);
      border-color: var(--immu-cyan);
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      aspect-ratio: 9/16;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    .thumbnail-box img, .thumbnail-box iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
    }

    .badge-new {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--badge-red);
      color: #fff;
      font-weight: 900;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      transform: rotate(-5deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .video-number {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--immu-cyan);
      color: var(--immu-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }

    .watermark-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(4px);
      color: var(--snaptube-yellow);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      z-index: 2;
    }

    .play-btn-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: rgba(0, 82, 204, 0.85);
      border: 2px solid var(--immu-cyan);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
      transition: all 0.3s ease;
      z-index: 2;
    }

    .play-btn-overlay::after {
      content: '';
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 8px 0 8px 14px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 3px;
    }

    .thumbnail-box:hover .play-btn-overlay {
      transform: translate(-50%, -50%) scale(1.15);
      background: var(--badge-red);
      border-color: #fff;
    }

    .video-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .video-title {
      font-size: 0.85rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
      color: #fff;
    }

    .video-highlight {
      background: var(--badge-red);
      color: #fff;
      padding: 0 4px;
      border-radius: 2px;
    }

    .neon-cyan {
      color: var(--immu-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .neon-yellow {
      color: var(--snaptube-yellow);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }

    .pricing-chips {
      display: flex;
      gap: 5px;
      margin: 8px 0;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .chip {
      background: rgba(0, 82, 204, 0.3);
      border: 1px solid var(--immu-electric);
      color: var(--immu-cyan);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .buy-btn-single {
      background: linear-gradient(135deg, var(--snaptube-yellow), #ffaa00);
      color: #000;
      font-size: 0.8rem;
      font-weight: 900;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 2px 10px rgba(255, 204, 0, 0.4);
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .buy-btn-single:hover {
      background: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 12, 16, 0.95);
      backdrop-filter: blur(10px);
      border-top: 2px solid var(--snaptube-yellow);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
    }

    .sticky-info {
      display: flex;
      flex-direction: column;
    }

    .sticky-price {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--snaptube-yellow);
    }

    .sticky-sub {
      font-size: 0.7rem;
      color: var(--immu-cyan);
      font-weight: 700;
    }

    .sticky-btn {
      background: linear-gradient(135deg, var(--snaptube-yellow), #ffaa00);
      color: #000;
      font-weight: 900;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 25
