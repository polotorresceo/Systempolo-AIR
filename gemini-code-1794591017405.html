<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SystemPolo AI - Catálogo de Videos Immunotec</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090d;
      --bg-card: #10141f;
      --immu-blue: #0052cc;
      --immu-electric: #00a3ff;
      --immu-cyan: #00f0ff;
      --snaptube-yellow: #ffd700;
      --badge-red: #ff1e27;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --glass-bg: rgba(16, 20, 31, 0.85);
      --glass-border: rgba(0, 163, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 82, 204, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.04) 0%, transparent 60%);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.5;
      padding-bottom: 100px;
    }

    /* HEADER / NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #07090d;
      border-bottom: 2px solid #0052cc;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      background-color: #0052cc;
      padding: 8px 16px;
      border-radius: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 1px solid #00a3ff;
      box-shadow: 0 0 15px rgba(0, 82, 204, 0.6);
    }

    .brand-tag {
      background-color: #001f5c;
      color: #00f0ff;
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 1.5px;
      border: 1px solid #00f0ff;
    }

    .header-cta {
      background: linear-gradient(135deg, var(--snaptube-yellow), #ffaa00);
      color: #000000;
      font-weight: 900;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.85rem;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-cta:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.85);
    }

    /* HERO SECTION */
    .hero {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .hero-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    @media (min-width: 850px) {
      .hero-card {
        grid-template-columns: 340px 1fr;
      }
    }

    .hero-video-container {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-bottom: 2px solid var(--immu-electric);
    }

    @media (min-width: 850px) {
      .hero-video-container {
        border-bottom: none;
        border-right: 2px solid var(--immu-electric);
      }
    }

    .hero-video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 9/16;
      max-height: 520px;
      background: #000;
    }

    .hero-video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hero-video-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--badge-red);
      color: #fff;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 30, 39, 0.8);
      z-index: 10;
    }

    .hero-content {
      padding: 35px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-subtitle {
      color: var(--immu-cyan);
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 1.85rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 15px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 163, 255, 0.3);
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .offer-box {
      background: rgba(0, 82, 204, 0.15);
      border: 1px solid rgba(0, 163, 255, 0.4);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }

    .price-tag {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--snaptube-yellow);
      display: flex;
      align-items: baseline;
      gap: 12px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .price-tag span {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .bonus-tag {
      color: var(--immu-cyan);
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero-btn {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.95), rgba(255, 170, 0, 0.95));
      color: #000000;
      font-size: 1.05rem;
      font-weight: 900;
      text-align: center;
      padding: 16px 22px;
      border-radius: 16px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 8px 25px rgba(255, 204, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hero-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 35px rgba(255, 204, 0, 0.75);
      background: #ffffff;
    }

    .funnel-btn {
      background: rgba(16, 20, 31, 0.75);
      color: var(--immu-cyan);
      border: 2px solid var(--immu-electric);
      font-size: 0.95rem;
      font-weight: 800;
      text-align: center;
      padding: 14px 22px;
      border-radius: 16px;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .funnel-btn:hover {
      background: var(--immu-electric);
      color: #000000;
    }

    /* CONTROLES Y BUSCADOR */
    .controls-section {
      max-width: 1200px;
      margin: 35px auto 20px;
      padding: 0 20px;
    }

    .search-bar {
      width: 100%;
      background: var(--glass-bg);
      border: 2px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px 22px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 18px;
    }

    .search-bar:focus {
      border-color: var(--immu-cyan);
    }

    .filter-tags {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .filter-btn {
      background: var(--glass-bg);
