<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SystemPolo AI - Catálogo de Videos Immunotec</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #121620;
      --immu-blue: #0052cc;
      --immu-electric: #00a3ff;
      --immu-cyan: #00f0ff;
      --magnetic-yellow: #ffcc00;
      --magnetic-yellow-glow: #ffe600;
      --snaptube-yellow: #ffd700;
      --badge-red: #ff1e27;
      --text-white: #ffffff;
      --text-muted: #b0b8c8;
      --border-glow: rgba(0, 163, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 82, 204, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.05) 0%, transparent 50%);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
    }

    /* HEADER / NAVBAR */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 12, 16, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--immu-blue);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 163, 255, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--magnetic-yellow), var(--immu-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-tag {
      background: var(--immu-blue);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header-cta {
      background: linear-gradient(135deg, var(--snaptube-yellow), var(--magnetic-yellow));
      color: #000;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.85rem;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-cta:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.9);
    }

    /* HERO SECTION CON VIDEO DE AVATAR EN MONTERREY */
    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .hero-card {
      background: linear-gradient(145deg, rgba(18, 22, 32, 0.9), rgba(10, 12, 16, 0.95));
      border: 2px solid var(--immu-electric);
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      box-shadow: 0 10px 30px rgba(0, 163, 255, 0.25);
    }

    @media (min-width: 850px) {
      .hero-card {
        grid-template-columns: 360px 1fr;
      }
    }

    .hero-video-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-bottom: 2px solid var(--immu-cyan);
    }

    @media (min-width: 850px) {
      .hero-video-container {
        height: 100%;
        border-bottom: none;
        border-right: 2px solid var(--immu-cyan);
      }
    }

    .hero-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-video-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--badge-red);
      color: #fff;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 30, 39, 0.8);
      z-index: 2;
    }

    .hero-content {
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-subtitle {
      color: var(--immu-cyan);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #ffffff, var(--immu-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .offer-box {
      background: rgba(0, 82, 204, 0.15);
      border: 1px solid var(--immu-blue);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .price-tag {
      font-size: 2rem;
      font-weight: 900;
      color: var(--snaptube-yellow);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .price-tag span {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .bonus-tag {
      color: var(--immu-cyan);
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hero-btn {
      background: linear-gradient(135deg, var(--snaptube-yellow), #ffaa00);
      color: #000;
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      padding: 16px 25px;
      border-radius: 40px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.7);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .hero-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 35px rgba(255, 204, 0, 0.95);
    }

    /* FILTROS Y BUSCADOR */
    .controls-section {
      max-width: 1200px;
      margin: 30px auto 20px;
      padding: 0 20px;
    }

    .search-bar {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--border-glow);
      border-radius: 30px;
      padding: 14px 20px;
